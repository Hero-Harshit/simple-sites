<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Screen</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="chat-app">
        <div class="header">
            <h1>Rahul</h1>
        </div>
        <div class="chat-container">
            <div class="msg-box sent">Hello Rahul, how are you?</div>
            <div class="msg-box received">Hi Varakumar, I am good. How about you?</div>
            <div class="msg-box sent">I'm fine. I published my website recently</div>
            <div class="msg-box received">Oh great Varakumar! Can you send me the URL?</div>
            <div class="msg-box sent">https://varakumar.ccbp.tech</div>
            <div class="msg-box received">Awesome Varakumar, where did you learn?</div>
            <div class="msg-box sent">NxtWave CCBP 4.0 Program</div>
        </div>
    </div>
</body>
</html>
