<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pizza Restaurant</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Pizza Point</h1>
        <p>The best slice in town!</p>
    </header>
    <main>
        <div class="pizza-grid">
            <div class="pizza-card">
                <h2>Margherita</h2>
                <p>Fresh tomato and mozzarella</p>
                <p class="price">₹199</p>
                <button>Order</button>
            </div>
            <div class="pizza-card">
                <h2>Pepperoni</h2>
                <p>Spicy pepperoni and cheese</p>
                <p class="price">₹299</p>
                <button>Order</button>
            </div>
            <div class="pizza-card">
                <h2>Veggie Supreme</h2>
                <p>Bell peppers, onions, olives, and mushrooms</p>
                <p class="price">₹249</p>
                <button>Order</button>
            </div>
            <div class="pizza-card">
                <h2>BBQ Chicken</h2>
                <p>Grilled chicken with BBQ sauce</p>
                <p class="price">₹349</p>
                <button>Order</button>
            </div>
        </div>
    </main>
</body>
</html>
