<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Save Earth</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="earth-container">
        <h1>🌍 Save Our Planet</h1>
        <p class="intro">The Earth is what we all have in common. Let's protect it together.</p>
        
        <div class="actions">
            <h2>Small Actions, Big Impact</h2>
            <ul>
                <li>🌱 Plant more trees</li>
                <li>♻️ Reduce, Reuse, Recycle</li>
                <li>💧 Conserve water</li>
                <li>🚲 Use public transport or cycle</li>
            </ul>
        </div>
        
        <p class="quote">"There is no Planet B."</p>
        <button>Take Action</button>
    </div>
</body>
</html>
