<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Tickets</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="booking-card">
        <div class="poster">
            <h2>SCI-FI EPIC</h2>
            <p>2025</p>
        </div>
        <div class="details">
            <h1>Select Seats</h1>
            <p class="screen">SCREEN</p>
            <div class="seats">
                <div class="seat occupied"></div>
                <div class="seat"></div>
                <div class="seat selected"></div>
                <div class="seat selected"></div>
                <div class="seat"></div>
                <div class="seat occupied"></div>
                
                <div class="seat"></div>
                <div class="seat"></div>
                <div class="seat"></div>
                <div class="seat occupied"></div>
                <div class="seat"></div>
                <div class="seat"></div>
                
                <div class="seat"></div>
                <div class="seat"></div>
                <div class="seat occupied"></div>
                <div class="seat occupied"></div>
                <div class="seat"></div>
                <div class="seat"></div>
            </div>
            <div class="legend">
                <span class="leg-item"><div class="seat small"></div> Available</span>
                <span class="leg-item"><div class="seat small selected"></div> Selected</span>
                <span class="leg-item"><div class="seat small occupied"></div> Occupied</span>
            </div>
            <button>Book Tickets (2)</button>
        </div>
    </div>
</body>
</html>
