<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Greeting</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="greeting-card">
        <div class="emojis">🎂 🎉 🎈 🎁</div>
        <h1>Happy Birthday!</h1>
        <h2>Sarah Jenkins</h2>
        <p class="message">Wishing you a fantastic day filled with joy, laughter, and lots of cake!</p>
        <p class="quote">"Count your life by smiles, not tears. Count your age by friends, not years."</p>
        <button>Celebrate</button>
    </div>
</body>
</html>
